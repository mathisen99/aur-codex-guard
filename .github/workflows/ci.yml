name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install --yes libarchive-tools shellcheck
      - run: python -m pip install --disable-pip-version-check build==1.3.0 mypy==1.18.2
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_policy_evals.py
      - run: sh -n packaging/system/* scripts/install-system.sh scripts/uninstall-system.sh
      - run: shellcheck packaging/system/* scripts/install-system.sh scripts/uninstall-system.sh
      - run: python -m compileall -q aur_codex_guard tests scripts/run_policy_evals.py
      - run: mypy aur_codex_guard
      - run: python -m build --wheel

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: 0.16.0
      - run: ruff check .
      - run: ruff format --check .
