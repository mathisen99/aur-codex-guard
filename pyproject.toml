[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "aur-codex-guard"
dynamic = ["version"]
description = "Defense-in-depth review gate for AUR packages installed with yay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Tommy Mathisen" }]
keywords = ["arch-linux", "aur", "pkgbuild", "security", "codex"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/mathisen99/aur-codex-guard"
Repository = "https://github.com/mathisen99/aur-codex-guard"
Issues = "https://github.com/mathisen99/aur-codex-guard/issues"

[project.scripts]
aur-codex-guard = "aur_codex_guard.cli:main"
aur-codex-guard-hook = "aur_codex_guard.cli:hook_main"
aur-codex-guard-makepkg = "aur_codex_guard.makepkg:makepkg_main"

[tool.hatch.build.targets.wheel]
packages = ["aur_codex_guard"]

[tool.hatch.build.targets.wheel.force-include]
"aur_codex_guard/schemas/review.schema.json" = "aur_codex_guard/schemas/review.schema.json"

[tool.hatch.version]
path = "aur_codex_guard/__init__.py"

[tool.ruff]
target-version = "py311"
line-length = 100
